<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O meu 18.º aniversário ♡</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Trebuchet MS', sans-serif;
      background: linear-gradient(135deg, #fff0f6, #f0e6ff, #ffeaf2);
      color: #805b7a;
      min-height: 100vh;
      text-align: center;
    }

    header {
      padding: 65px 20px 35px;
    }

    .decoration {
      font-size: 25px;
      letter-spacing: 12px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(32px, 9vw, 52px);
      color: #bd79a6;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.7;
      max-width: 330px;
      margin: auto;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
      max-width: 440px;
      padding: 20px;
      margin: auto;
    }

    .menu button {
      border: 1px solid #f0d2e5;
      background: rgba(255,255,255,0.7);
      color: #a66e96;
      border-radius: 18px;
      padding: 20px 10px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .menu button:active {
      transform: scale(0.96);
    }

    .content {
      margin: 10px 20px 35px;
      padding: 25px;
      background: rgba(255,255,255,0.65);
      border: 1px solid #f1d8e8;
      border-radius: 24px;
      min-height: 140px;
    }

    .content h2 {
      color: #bd79a6;
      margin-bottom: 15px;
    }

    .content p {
      line-height: 1.8;
    }

    footer {
      padding: 25px;
      font-size: 13px;
      color: #a88ba2;
    }
  </style>
</head>

<body>

  <header>
    <div class="decoration">✿ ✧ ♡ ✧ ✿</div>

    <h1>O meu 18.º aniversário</h1>

    <p class="subtitle">
      Um novo capítulo começa...
      <br>
      Bem-vinda ao meu pequeno universo! ♡
    </p>
  </header>

  <nav class="menu">
    <button onclick="mostrar('historia')">📖 A minha história</button>
    <button onclick="mostrar('conquistas')">🌟 Conquistas</button>
    <button onclick="mostrar('sonhos')">💭 Os meus sonhos</button>
    <button onclick="mostrar('galeria')">📸 Galeria</button>
    <button onclick="mostrar('surpresas')">🎁 Surpresas</button>
    <button onclick="mostrar('sobre')">🎀 Sobre mim</button>
  </nav>

  <main class="content" id="conteudo">
    <h2>Bem-vinda! 🌸</h2>
    <p>
      Este espaço é meu.
      <br>
      Um lugar para guardar memórias,
      celebrar conquistas e sonhar com o futuro.
    </p>
  </main>

  <footer>
    Feito com ♡ para celebrar uma nova etapa.
  </footer>

  <script>
    const secoes = {
     historia: ["📖 A minha história", `Cada pessoa tem uma história única, e esta é a minha.<br><br>

Ao longo da vida, passei por diferentes fases, vivi momentos especiais, enfrentei desafios e fui descobrindo mais sobre mim.<br><br>

A infância trouxe as primeiras experiências e recordações. Com o passar dos anos, fui crescendo, aprendendo e construindo a minha própria maneira de ver o mundo.<br><br>

Nem todos os caminhos foram fáceis, mas cada experiência fez parte do meu percurso. Conheci pessoas, criei amizades, descobri interesses e encontrei atividades que me permitem expressar a minha criatividade.<br><br>

A imaginação sempre teve um lugar especial na minha vida. Criar, desenhar, inventar histórias e dar vida a ideias fazem parte de quem sou.<br><br>

Também tive conquistas das quais me orgulho, momentos que me fizeram sorrir e desafios que me ensinaram a continuar.<br><br>

Hoje, estou prestes a iniciar uma nova etapa. Os 18 anos representam mais um capítulo, cheio de possibilidades, sonhos e novas experiências.<br><br>

Ainda tenho muito para descobrir, aprender e realizar.<br><br>

<strong>Esta é a minha história. E ainda há muitas páginas por escrever. ♡</strong>`],
      conquistas: ["🌟 As minhas conquistas", "Pequenas ou grandes, todas as minhas conquistas merecem ser celebradas!"],
      sonhos: ["💭 Os meus sonhos", "O futuro está cheio de possibilidades. Este é o lugar dos meus sonhos."],
      galeria: ["📸 Galeria", "As fotografias e recordações que quero guardar."],
      surpresas: ["🎁 Surpresas", "Existem pequenos segredos à espera de serem descobertos!"],
      sobre: ["🎀 Sobre mim", "Um bocadinho de quem sou, das coisas que adoro e daquilo que me torna única."]
    };

    function mostrar(secao) {
      const dados = secoes[secao];

      document.getElementById("conteudo").innerHTML =
        `<h2>${dados[0]}</h2><p>${dados[1]}</p>`;

      document.getElementById("conteudo").scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }
  </script>

</body>
</html>
